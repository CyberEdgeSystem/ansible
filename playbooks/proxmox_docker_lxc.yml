---
- name: Deploy Docker LXC on Proxmox
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # ---------------------------------------------------------
    # Proxmox
    # ---------------------------------------------------------
    proxmox_host: "172.16.11.6"
    proxmox_node: "pve"
    proxmox_api_port: 8006

    proxmox_user: "awx@pve"
    proxmox_token_name: "awx"

    proxmox_token: "{{ proxmox_token }}"

    proxmox_api_url: "https://{{ proxmox_host }}:{{ proxmox_api_port }}/api2/json"

    proxmox_auth_header:
      Authorization: "PVEAPIToken={{ proxmox_user }}!{{ proxmox_token_name }}={{ proxmox_token }}"

    # ---------------------------------------------------------
    # LXC
    # ---------------------------------------------------------
    lxc_vmid: 151
    lxc_hostname: "docker-151"

    lxc_template: "pve-sdb:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
    lxc_storage: "pve-sde"

    lxc_cores: 2
    lxc_memory: 2048
    lxc_swap: 512
    lxc_disk_size: 10

    # ---------------------------------------------------------
    # Network
    # ---------------------------------------------------------
    lxc_bridge: "vmbr1"
    lxc_ip: "172.16.12.151/24"
    lxc_gateway: "172.16.12.254"

    # IMPORTANT:
    # No VLAN tag here.
    # vmbr1 already handles the required network.
    lxc_net0: "name=eth0,bridge={{ lxc_bridge }},ip={{ lxc_ip }},gw={{ lxc_gateway }}"

    # ---------------------------------------------------------
    # LXC authentication
    # ---------------------------------------------------------
    lxc_root_password: "ChangeMe123!"

    # ---------------------------------------------------------
    # Behaviour
    # ---------------------------------------------------------
    cleanup_existing: true

  tasks:

    # =========================================================
    # 1. Check whether LXC already exists
    # =========================================================
    - name: Check existing LXC
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current"
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
          - 500
        return_content: true
      register: existing_lxc
      failed_when: false

    - name: Determine whether LXC exists
      ansible.builtin.set_fact:
        lxc_exists: "{{ existing_lxc.status == 200 }}"

    - name: Show existing LXC state
      ansible.builtin.debug:
        msg:
          - "LXC {{ lxc_vmid }} exists: {{ lxc_exists }}"
          - "Status: {{ existing_lxc.status }}"

    # =========================================================
    # 2. Get current status if LXC exists
    # =========================================================
    - name: Get existing LXC status
      ansible.builtin.set_fact:
        existing_lxc_status: "{{ existing_lxc.json.data.status | default('unknown') }}"
      when: lxc_exists

    - name: Show current LXC status
      ansible.builtin.debug:
        msg: "Existing LXC {{ lxc_vmid }} status: {{ existing_lxc_status }}"
      when: lxc_exists

    # =========================================================
    # 3. Stop existing LXC
    # =========================================================
    - name: Stop existing LXC
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/stop"
        method: POST
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
        return_content: true
      register: stop_task
      when:
        - lxc_exists
        - cleanup_existing
        - existing_lxc_status == "running"

    - name: Wait for LXC to stop
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current"
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
          - 500
        return_content: true
      register: lxc_stop_status
      until:
        - lxc_stop_status.status == 500
          or
          lxc_stop_status.json.data.status | default('stopped') == "stopped"
      retries: 30
      delay: 2
      when:
        - lxc_exists
        - cleanup_existing
        - existing_lxc_status == "running"

    # =========================================================
    # 4. Delete existing LXC
    # =========================================================
    - name: Delete existing LXC
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}"
        method: DELETE
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
        return_content: true
      register: delete_task
      when:
        - lxc_exists
        - cleanup_existing

    - name: Wait until old LXC is completely removed
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current"
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
          - 500
        return_content: true
      register: delete_check
      until: delete_check.status == 500
      retries: 60
      delay: 2
      when:
        - lxc_exists
        - cleanup_existing

    # =========================================================
    # 5. Create new LXC
    # =========================================================
    - name: Create LXC
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc"
        method: POST
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        body_format: form-urlencoded
        body:
          vmid: "{{ lxc_vmid }}"
          hostname: "{{ lxc_hostname }}"
          ostemplate: "{{ lxc_template }}"

          storage: "{{ lxc_storage }}"
          rootfs: "{{ lxc_storage }}:{{ lxc_disk_size }}"

          cores: "{{ lxc_cores }}"
          memory: "{{ lxc_memory }}"
          swap: "{{ lxc_swap }}"

          password: "{{ lxc_root_password }}"

          unprivileged: 1

          features: "nesting=1"

          net0: "{{ lxc_net0 }}"

          start: 0

          onboot: 1

          ostype: "unmanaged"

        status_code:
          - 200
        return_content: true
      register: create_lxc

    - name: Show LXC creation task
      ansible.builtin.debug:
        var: create_lxc.json

    # =========================================================
    # 6. Start LXC
    # =========================================================
    - name: Start LXC
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/start"
        method: POST
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
        return_content: true
      register: start_lxc

    - name: Show start task
      ansible.builtin.debug:
        var: start_lxc.json

    # =========================================================
    # 7. Wait until LXC is running
    # =========================================================
    - name: Wait until LXC is running
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current"
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
        return_content: true
      register: lxc_status
      until:
        - lxc_status.json.data.status | default('stopped') == "running"
      retries: 30
      delay: 2

    # =========================================================
    # 8. Wait for SSH port
    # =========================================================
    - name: Wait for SSH port
      ansible.builtin.wait_for:
        host: "{{ lxc_ip | regex_replace('/.*$', '') }}"
        port: 22
        delay: 5
        timeout: 120
        state: started

    # =========================================================
    # 9. Add new LXC to temporary inventory
    # =========================================================
    - name: Add LXC to temporary inventory
      ansible.builtin.add_host:
        name: "lxc-{{ lxc_vmid }}"
        groups: docker_lxc
        ansible_host: "{{ lxc_ip | regex_replace('/.*$', '') }}"
        ansible_user: root
        ansible_password: "{{ lxc_root_password }}"
        ansible_connection: ssh

        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null

    # =========================================================
    # 10. Show information
    # =========================================================
    - name: Show LXC information
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "LXC CREATED"
          - "VMID:      {{ lxc_vmid }}"
          - "Hostname:  {{ lxc_hostname }}"
          - "IP:        {{ lxc_ip }}"
          - "Gateway:   {{ lxc_gateway }}"
          - "Bridge:    {{ lxc_bridge }}"
          - "Storage:   {{ lxc_storage }}"
          - "CPU:       {{ lxc_cores }}"
          - "RAM:       {{ lxc_memory }} MB"
          - "Disk:      {{ lxc_disk_size }} GB"
          - "=========================================="


# =================================================================
# CONFIGURE DOCKER INSIDE LXC
# =================================================================

- name: Configure Docker inside LXC
  hosts: docker_lxc
  gather_facts: true
  become: true

  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:

    # =========================================================
    # 11. Configure root SSH
    # =========================================================
    - name: Configure root SSH login
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-ansible-root.conf
        content: |
          PermitRootLogin yes
          PasswordAuthentication yes
        owner: root
        group: root
        mode: "0600"
      notify: Restart SSH

    # =========================================================
    # 12. Ensure SSH service is enabled
    # =========================================================
    - name: Ensure SSH service is enabled
      ansible.builtin.systemd:
        name: ssh
        enabled: true
        state: started

    # =========================================================
    # 13. Update apt cache
    # =========================================================
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # =========================================================
    # 14. Install prerequisites
    # =========================================================
    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    # =========================================================
    # 15. Create Docker keyring directory
    # =========================================================
    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    # =========================================================
    # 16. Download Docker GPG key
    # =========================================================
    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    # =========================================================
    # 17. Add Docker repository
    # =========================================================
    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }}
          stable
        filename: docker
        state: present

    # =========================================================
    # 18. Update apt after repository
    # =========================================================
    - name: Update apt cache after Docker repository
      ansible.builtin.apt:
        update_cache: true

    # =========================================================
    # 19. Install Docker
    # =========================================================
    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    # =========================================================
    # 20. Enable Docker
    # =========================================================
    - name: Enable Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # =========================================================
    # 21. Verify Docker
    # =========================================================
    - name: Check Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Check Docker Compose version
      ansible.builtin.command:
        cmd: docker compose version
      register: docker_compose_version
      changed_when: false

    # =========================================================
    # 22. Final result
    # =========================================================
    - name: Show Docker installation result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "DOCKER LXC READY"
          - "Hostname: {{ inventory_hostname }}"
          - "IP: {{ ansible_host }}"
          - "Docker: {{ docker_version.stdout }}"
          - "Compose: {{ docker_compose_version.stdout }}"
          - "=========================================="

  handlers:

    - name: Restart SSH
      ansible.builtin.systemd:
        name: ssh
        state: restarted