---
- name: Deploy and test Docker LXC
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # =========================================================
    # PROXMOX
    # =========================================================

    proxmox_api_host: "172.16.11.6"
    proxmox_node: "pve"

    # =========================================================
    # TEST / CLEANUP
    # =========================================================

    cleanup_existing: true
    cleanup_on_success: true
    cleanup_on_failure: false

    # =========================================================
    # LXC
    # =========================================================

    lxc_vmid: 151
    lxc_hostname: "docker-151"

    lxc_template: "pve-sdb:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"

    lxc_password: "ChangeMe123!"

    lxc_cores: 2
    lxc_memory: 2048
    lxc_swap: 512
    lxc_disk: 10

    lxc_storage: "pve-sde"

    # =========================================================
    # NETWORK
    # =========================================================

    lxc_bridge: "vmbr1"
    lxc_ip: "172.16.12.151/24"
    lxc_ip_plain: "172.16.12.151"
    lxc_gateway: "172.16.12.254"

  tasks:

    # =========================================================
    # 1. CHECK EXISTING LXC
    # =========================================================

    - name: Check existing LXC
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current"
        method: GET
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        status_code:
          - 200
          - 404
          - 500
        return_content: true
      register: existing_lxc

    # =========================================================
    # 2. STOP EXISTING LXC
    # =========================================================

    - name: Stop existing LXC
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/stop"
        method: POST
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        status_code:
          - 200
          - 500
        return_content: true
      when:
        - cleanup_existing
        - existing_lxc.status == 200
      register: existing_lxc_stop

    # =========================================================
    # 3. WAIT EXISTING LXC STOP
    # =========================================================

    - name: Wait for existing LXC to stop
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current"
        method: GET
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        status_code:
          - 200
          - 404
          - 500
        return_content: true
      register: existing_lxc_status
      until:
        - existing_lxc_status.status != 200
          or existing_lxc_status.json.data.status == "stopped"
      retries: 30
      delay: 2
      when:
        - cleanup_existing
        - existing_lxc.status == 200

    # =========================================================
    # 4. DESTROY EXISTING LXC
    # =========================================================

    - name: Destroy existing LXC
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}"
        method: DELETE
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        status_code:
          - 200
        return_content: true
      register: existing_lxc_destroy
      when:
        - cleanup_existing
        - existing_lxc.status == 200

    # =========================================================
    # 5. WAIT DESTROY
    # =========================================================

    - name: Wait for old LXC to disappear
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current"
        method: GET
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        status_code:
          - 200
          - 404
          - 500
        return_content: true
      register: old_lxc_check
      until:
        - old_lxc_check.status != 200
      retries: 60
      delay: 2
      when:
        - cleanup_existing
        - existing_lxc.status == 200

    # =========================================================
    # 6. CREATE NEW LXC
    # =========================================================

    - name: Create LXC
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc"
        method: POST
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        body_format: form-urlencoded
        body:
          vmid: "{{ lxc_vmid }}"
          hostname: "{{ lxc_hostname }}"
          ostemplate: "{{ lxc_template }}"
          password: "{{ lxc_password }}"

          cores: "{{ lxc_cores }}"
          memory: "{{ lxc_memory }}"
          swap: "{{ lxc_swap }}"

          rootfs: "{{ lxc_storage }}:{{ lxc_disk }}"

          net0: "name=eth0,bridge={{ lxc_bridge }},ip={{ lxc_ip }},gw={{ lxc_gateway }}"

          features: "nesting=1"

          unprivileged: 1
          onboot: 1
          start: 0

        status_code:
          - 200
        return_content: true
      register: lxc_create

    - name: Show creation UPID
      ansible.builtin.debug:
        var: lxc_create.json

    # =========================================================
    # 7. WAIT CREATE
    # =========================================================

    - name: Wait for LXC creation
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/tasks/{{ lxc_create.json.data }}/status"
        method: GET
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        return_content: true
      register: create_task
      until: create_task.json.data.status == "stopped"
      retries: 60
      delay: 2

    - name: Check creation result
      ansible.builtin.fail:
        msg: "LXC creation failed: {{ create_task.json.data }}"
      when:
        - create_task.json.data.exitstatus is defined
        - create_task.json.data.exitstatus != "OK"

    # =========================================================
    # 8. START LXC
    # =========================================================

    - name: Start LXC
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/start"
        method: POST
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        status_code:
          - 200
        return_content: true
      register: lxc_start

    # =========================================================
    # 9. WAIT START
    # =========================================================

    - name: Wait for LXC start
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/tasks/{{ lxc_start.json.data }}/status"
        method: GET
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        return_content: true
      register: start_task
      until: start_task.json.data.status == "stopped"
      retries: 60
      delay: 2

    - name: Check start result
      ansible.builtin.fail:
        msg: "LXC start failed: {{ start_task.json.data }}"
      when:
        - start_task.json.data.exitstatus is defined
        - start_task.json.data.exitstatus != "OK"

    # =========================================================
    # 10. WAIT SSH
    # =========================================================

    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ lxc_ip_plain }}"
        port: 22
        state: started
        timeout: 120
        delay: 5

    # =========================================================
    # 11. ADD LXC TO INVENTORY
    # =========================================================

    - name: Add LXC to Ansible inventory
      ansible.builtin.add_host:
        name: "lxc-{{ lxc_vmid }}"
        groups:
          - docker_lxc
        ansible_host: "{{ lxc_ip_plain }}"
        ansible_user: root
        ansible_password: "{{ lxc_password }}"
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null

    # =========================================================
    # 12. INFORMATION
    # =========================================================

    - name: Show LXC information
      ansible.builtin.debug:
        msg:
          - "LXC created"
          - "VMID: {{ lxc_vmid }}"
          - "Hostname: {{ lxc_hostname }}"
          - "IP: {{ lxc_ip_plain }}"
          - "SSH: {{ lxc_ip_plain }}:22"


# =============================================================
# CONFIGURE LXC
# =============================================================

- name: Configure Docker inside LXC
  hosts: docker_lxc
  gather_facts: true

  tasks:

    # =========================================================
    # 13. SSH TEST
    # =========================================================

    - name: Test SSH connection
      ansible.builtin.ping:

    # =========================================================
    # 14. APT
    # =========================================================

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # =========================================================
    # 15. PREREQUISITES
    # =========================================================

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    # =========================================================
    # 16. DOCKER KEYRING
    # =========================================================

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    # =========================================================
    # 17. DOCKER REPOSITORY
    # =========================================================

    - name: Configure Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    # =========================================================
    # 18. INSTALL DOCKER
    # =========================================================

    - name: Install Docker
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    # =========================================================
    # 19. START DOCKER
    # =========================================================

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # =========================================================
    # 20. VERIFY DOCKER
    # =========================================================

    - name: Get Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Show Docker version
      ansible.builtin.debug:
        var: docker_version.stdout

    # =========================================================
    # 21. VERIFY COMPOSE
    # =========================================================

    - name: Get Docker Compose version
      ansible.builtin.command:
        cmd: docker compose version
      register: docker_compose
      changed_when: false

    - name: Show Docker Compose version
      ansible.builtin.debug:
        var: docker_compose.stdout

    # =========================================================
    # 22. SUCCESS
    # =========================================================

    - name: Deployment successful
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "DOCKER LXC TEST SUCCESSFUL"
          - "========================================"
          - "VMID: {{ lxc_vmid }}"
          - "Hostname: {{ lxc_hostname }}"
          - "IP: {{ lxc_ip_plain }}"
          - "Docker: {{ docker_version.stdout }}"
          - "Compose: {{ docker_compose.stdout }}"
          - "========================================"


# =============================================================
# CLEANUP
# =============================================================

- name: Cleanup test LXC
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    proxmox_api_host: "172.16.11.6"
    proxmox_node: "pve"
    lxc_vmid: 151
    cleanup_on_success: true

  tasks:

    - name: Check LXC before cleanup
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current"
        method: GET
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        status_code:
          - 200
          - 404
          - 500
        return_content: true
      register: cleanup_check

    - name: Stop LXC before cleanup
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/stop"
        method: POST
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        status_code:
          - 200
          - 500
        return_content: true
      when:
        - cleanup_on_success
        - cleanup_check.status == 200
        - cleanup_check.json.data.status == "running"
      register: cleanup_stop

    - name: Wait for LXC stop
      ansible.builtin.pause:
        seconds: 5
      when:
        - cleanup_on_success
        - cleanup_check.status == 200
        - cleanup_check.json.data.status == "running"

    - name: Destroy test LXC
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}"
        method: DELETE
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        status_code:
          - 200
        return_content: true
      when:
        - cleanup_on_success
        - cleanup_check.status == 200

    - name: Cleanup summary
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "TEST LXC REMOVED"
          - "VMID: {{ lxc_vmid }}"
          - "========================================"
      when: cleanup_on_success