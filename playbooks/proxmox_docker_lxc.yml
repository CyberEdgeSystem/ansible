---
- name: Deploy Docker LXC on Proxmox
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # =========================================================
    # PROXMOX
    # =========================================================
    proxmox_host: "172.16.11.6"
    proxmox_node: "pve"
    proxmox_api_port: 8006

    proxmox_user: "awx@pve"
    proxmox_token_name: "awx"

    # Передається з AWX Extra Variables
    proxmox_token: "{{ proxmox_token }}"

    proxmox_api_url: "https://{{ proxmox_host }}:{{ proxmox_api_port }}/api2/json"

    proxmox_auth_header:
      Authorization: "PVEAPIToken={{ proxmox_user }}!{{ proxmox_token_name }}={{ proxmox_token }}"

    # =========================================================
    # LXC
    # =========================================================
    lxc_vmid: 151
    lxc_hostname: "docker-151"

    lxc_template: "pve-sdb:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"

    # Диск LXC
    lxc_storage: "pve-sde"
    lxc_disk_size: 10

    # Ресурси
    lxc_cores: 2
    lxc_memory: 2048
    lxc_swap: 512

    # =========================================================
    # NETWORK
    # =========================================================
    lxc_bridge: "vmbr1"
    lxc_ip: "172.16.12.151/24"
    lxc_gateway: "172.16.12.254"

    # ВАЖЛИВО:
    # VLAN TAG НЕ ВИКОРИСТОВУЄМО.
    lxc_net0: "name=eth0,bridge={{ lxc_bridge }},ip={{ lxc_ip }},gw={{ lxc_gateway }}"

    # =========================================================
    # PASSWORD
    # =========================================================
    # Передається з AWX Extra Variables:
    #
    # lxc_password: "твій_пароль"
    #
    lxc_root_password: "{{ lxc_password }}"

    # =========================================================
    # BEHAVIOUR
    # =========================================================
    # Якщо старий LXC 151 існує — видалити перед створенням нового.
    #
    # Після успішного створення НІКОЛИ НЕ ВИДАЛЯЄМО його.
    cleanup_existing: true

  tasks:

    # =========================================================
    # 1. CHECK EXISTING LXC
    # =========================================================

    - name: Check whether LXC exists
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current"
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
          - 500
        return_content: true
      register: existing_lxc
      failed_when: false

    - name: Determine whether LXC exists
      ansible.builtin.set_fact:
        lxc_exists: "{{ existing_lxc.status == 200 }}"

    - name: Show existing LXC information
      ansible.builtin.debug:
        msg:
          - "LXC VMID: {{ lxc_vmid }}"
          - "Exists: {{ lxc_exists }}"
          - "HTTP status: {{ existing_lxc.status }}"

    # =========================================================
    # 2. GET EXISTING LXC STATUS
    # =========================================================

    - name: Get existing LXC state
      ansible.builtin.set_fact:
        existing_lxc_status: "{{ existing_lxc.json.data.status | default('unknown') }}"
      when: lxc_exists

    - name: Show existing LXC state
      ansible.builtin.debug:
        msg: "Existing LXC {{ lxc_vmid }} state: {{ existing_lxc_status }}"
      when: lxc_exists

    # =========================================================
    # 3. STOP OLD LXC
    # =========================================================

    - name: Stop existing LXC
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/stop"
        method: POST
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
        return_content: true
      register: stop_lxc_task
      when:
        - lxc_exists
        - cleanup_existing
        - existing_lxc_status == "running"

    - name: Wait until old LXC is stopped
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current"
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
          - 500
        return_content: true
      register: stop_check
      until:
        - stop_check.status == 500
          or
          stop_check.json.data.status | default('stopped') == "stopped"
      retries: 30
      delay: 2
      when:
        - lxc_exists
        - cleanup_existing
        - existing_lxc_status == "running"

    # =========================================================
    # 4. DELETE OLD LXC
    # =========================================================

    - name: Delete existing LXC
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}"
        method: DELETE
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
        return_content: true
      register: delete_lxc_task
      when:
        - lxc_exists
        - cleanup_existing

    - name: Show delete task
      ansible.builtin.debug:
        var: delete_lxc_task.json
      when:
        - lxc_exists
        - cleanup_existing

    - name: Wait until old LXC is completely removed
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current"
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
          - 500
        return_content: true
      register: delete_check
      until: delete_check.status == 500
      retries: 60
      delay: 2
      when:
        - lxc_exists
        - cleanup_existing

    # =========================================================
    # 5. CREATE NEW LXC
    # =========================================================

    - name: Create new LXC
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc"
        method: POST
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        body_format: form-urlencoded

        body:
          vmid: "{{ lxc_vmid }}"
          hostname: "{{ lxc_hostname }}"

          # Ubuntu 22.04 template
          ostemplate: "{{ lxc_template }}"

          # Disk
          storage: "{{ lxc_storage }}"
          rootfs: "{{ lxc_storage }}:{{ lxc_disk_size }}"

          # Resources
          cores: "{{ lxc_cores }}"
          memory: "{{ lxc_memory }}"
          swap: "{{ lxc_swap }}"

          # Root password
          password: "{{ lxc_root_password }}"

          # Unprivileged LXC
          unprivileged: 1

          # Docker inside LXC
          features: "nesting=1"

          # Network
          #
          # NO VLAN TAG!
          #
          net0: "{{ lxc_net0 }}"

          # Do not start during creation
          start: 0

          # Start automatically after Proxmox reboot
          onboot: 1

          ostype: "unmanaged"

        status_code:
          - 200
        return_content: true
      register: create_lxc

    - name: Show LXC creation result
      ansible.builtin.debug:
        var: create_lxc.json

    # =========================================================
    # 6. START LXC
    # =========================================================

    - name: Start LXC
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/start"
        method: POST
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
        return_content: true
      register: start_lxc

    - name: Show start result
      ansible.builtin.debug:
        var: start_lxc.json

    # =========================================================
    # 7. WAIT UNTIL RUNNING
    # =========================================================

    - name: Wait until LXC is running
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current"
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
        return_content: true
      register: lxc_status
      until:
        - lxc_status.json.data.status | default('stopped') == "running"
      retries: 30
      delay: 2

    # =========================================================
    # 8. WAIT FOR SSH
    # =========================================================

    - name: Wait for SSH port
      ansible.builtin.wait_for:
        host: "{{ lxc_ip | regex_replace('/.*$', '') }}"
        port: 22
        delay: 5
        timeout: 120
        state: started

    # =========================================================
    # 9. ADD LXC TO TEMPORARY INVENTORY
    # =========================================================

    - name: Add LXC to temporary inventory
      ansible.builtin.add_host:
        name: "lxc-{{ lxc_vmid }}"
        groups: docker_lxc

        ansible_host: "{{ lxc_ip | regex_replace('/.*$', '') }}"
        ansible_user: root
        ansible_password: "{{ lxc_root_password }}"

        ansible_connection: ssh

        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null

    # =========================================================
    # 10. SHOW LXC INFORMATION
    # =========================================================

    - name: Show LXC information
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "LXC CREATED"
          - "=========================================="
          - "VMID:      {{ lxc_vmid }}"
          - "Hostname:  {{ lxc_hostname }}"
          - "IP:        {{ lxc_ip }}"
          - "Gateway:   {{ lxc_gateway }}"
          - "Bridge:    {{ lxc_bridge }}"
          - "Storage:   {{ lxc_storage }}"
          - "CPU:       {{ lxc_cores }}"
          - "RAM:       {{ lxc_memory }} MB"
          - "Swap:      {{ lxc_swap }} MB"
          - "Disk:      {{ lxc_disk_size }} GB"
          - "=========================================="


# =================================================================
# DOCKER CONFIGURATION
# =================================================================

- name: Configure Docker inside LXC
  hosts: docker_lxc
  gather_facts: true
  become: true

  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:

    # =========================================================
    # 11. ENSURE SSH IS ENABLED
    # =========================================================

    - name: Ensure SSH service is enabled
      ansible.builtin.systemd:
        name: ssh
        enabled: true
        state: started

    # =========================================================
    # 12. UPDATE APT
    # =========================================================

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # =========================================================
    # 13. INSTALL DOCKER PREREQUISITES
    # =========================================================

    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    # =========================================================
    # 14. CREATE DOCKER KEYRING DIRECTORY
    # =========================================================

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    # =========================================================
    # 15. DOWNLOAD DOCKER GPG KEY
    # =========================================================

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    # =========================================================
    # 16. ADD DOCKER REPOSITORY
    # =========================================================

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }}
          stable
        filename: docker
        state: present

    # =========================================================
    # 17. UPDATE APT
    # =========================================================

    - name: Update apt cache after Docker repository
      ansible.builtin.apt:
        update_cache: true

    # =========================================================
    # 18. INSTALL DOCKER
    # =========================================================

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    # =========================================================
    # 19. ENABLE DOCKER
    # =========================================================

    - name: Enable Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # =========================================================
    # 20. VERIFY DOCKER
    # =========================================================

    - name: Check Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Check Docker Compose version
      ansible.builtin.command:
        cmd: docker compose version
      register: docker_compose_version
      changed_when: false

    # =========================================================
    # 21. FINAL RESULT
    # =========================================================

    - name: Show Docker installation result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "DOCKER LXC READY"
          - "=========================================="
          - "Hostname: {{ inventory_hostname }}"
          - "IP:       {{ ansible_host }}"
          - "Docker:   {{ docker_version.stdout }}"
          - "Compose:  {{ docker_compose_version.stdout }}"
          - "=========================================="
          - "LXC {{ lxc_vmid | default('151') }} REMAINS RUNNING"
          - "=========================================="