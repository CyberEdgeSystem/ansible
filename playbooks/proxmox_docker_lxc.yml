---
# =============================================================
# PROXMOX LXC + DOCKER
#
# AWX
#   ↓
# Proxmox API
#   ↓
# LXC
#   ↓
# SSH через sshpass
#   ↓
# Docker
#
# IMPORTANT:
# - SSH to Proxmox host is NOT used
# - proxmox_ssh_password is NOT used
# - AWX Machine Credential is NOT used for LXC SSH
# - LXC password is taken directly from lxc_password
# =============================================================


# =============================================================
# PLAY 1
# CREATE LXC THROUGH PROXMOX API
# =============================================================

- name: Create LXC through Proxmox API
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ---------------------------------------------------------
    # PROXMOX API
    # ---------------------------------------------------------

    proxmox_host: "172.16.11.6"
    proxmox_node: "pve"
    proxmox_api_port: 8006

    proxmox_user: "awx@pve"
    proxmox_token_name: "awx"

    proxmox_api_url: >-
      https://{{ proxmox_host }}:{{ proxmox_api_port }}/api2/json

    proxmox_auth_header:
      Authorization: >-
        PVEAPIToken={{ proxmox_user }}!{{ proxmox_token_name }}={{ proxmox_token }}

    # ---------------------------------------------------------
    # LXC TEMPLATE
    # ---------------------------------------------------------

    lxc_template: >-
      pve-sdb:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst

    lxc_storage: "pve-sde"

    # ---------------------------------------------------------
    # RESOURCES
    # ---------------------------------------------------------

    lxc_disk_size: 10
    lxc_cores: 2
    lxc_memory: 2048
    lxc_swap: 512

    # ---------------------------------------------------------
    # NETWORK
    # ---------------------------------------------------------

    lxc_bridge: "vmbr1"

    # NO VLAN TAG
    lxc_net0: >-
      name=eth0,bridge={{ lxc_bridge }},ip={{ lxc_ip }},gw={{ lxc_gateway }}

    # ---------------------------------------------------------
    # BEHAVIOUR
    # ---------------------------------------------------------

    cleanup_existing: true

  tasks:

    # =========================================================
    # 1. VALIDATE VARIABLES
    # =========================================================

    - name: Validate required AWX Extra Variables
      ansible.builtin.assert:
        that:
          - proxmox_token is defined
          - proxmox_token | length > 0

          - lxc_vmid is defined
          - (lxc_vmid | string) | length > 0

          - lxc_hostname is defined
          - lxc_hostname | length > 0

          - lxc_password is defined
          - lxc_password | length > 0

          - lxc_ip is defined
          - lxc_ip | length > 0

          - lxc_gateway is defined
          - lxc_gateway | length > 0

        fail_msg: |
          Required AWX Extra Variables are missing.

          Required variables:

          proxmox_token
          lxc_vmid
          lxc_hostname
          lxc_password
          lxc_ip
          lxc_gateway

    # =========================================================
    # 2. SHOW PARAMETERS
    # =========================================================

    - name: Show deployment parameters
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "PROXMOX LXC DEPLOYMENT"
          - "=========================================="
          - "VMID:      {{ lxc_vmid }}"
          - "Hostname:  {{ lxc_hostname }}"
          - "IP:        {{ lxc_ip }}"
          - "Gateway:   {{ lxc_gateway }}"
          - "Bridge:    {{ lxc_bridge }}"
          - "Template:  {{ lxc_template }}"
          - "Storage:   {{ lxc_storage }}"
          - "Disk:      {{ lxc_disk_size }} GB"
          - "CPU:       {{ lxc_cores }}"
          - "RAM:       {{ lxc_memory }} MB"
          - "Swap:      {{ lxc_swap }} MB"
          - "=========================================="

    # =========================================================
    # 3. CHECK EXISTING LXC
    # =========================================================

    - name: Check whether LXC exists
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
          - 500
        return_content: true
      register: existing_lxc
      failed_when: false

    - name: Determine whether LXC exists
      ansible.builtin.set_fact:
        lxc_exists: "{{ existing_lxc.status == 200 }}"

    # =========================================================
    # 4. GET EXISTING STATUS
    # =========================================================

    - name: Get existing LXC status
      ansible.builtin.set_fact:
        existing_lxc_status: >-
          {{ existing_lxc.json.data.status | default('unknown') }}
      when: lxc_exists

    - name: Show existing LXC status
      ansible.builtin.debug:
        msg:
          - "Existing LXC: {{ lxc_exists }}"
          - "Status: {{ existing_lxc_status | default('N/A') }}"

    # =========================================================
    # 5. STOP EXISTING LXC
    # =========================================================

    - name: Stop existing LXC
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/stop
        method: POST
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code: 200
        return_content: true
      when:
        - lxc_exists
        - cleanup_existing
        - existing_lxc_status == "running"

    # =========================================================
    # 6. WAIT FOR STOP
    # =========================================================

    - name: Wait until existing LXC is stopped
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
          - 500
        return_content: true
      register: stop_check
      until:
        - stop_check.status == 500 or
          stop_check.json.data.status | default('stopped') == "stopped"
      retries: 30
      delay: 2
      when:
        - lxc_exists
        - cleanup_existing
        - existing_lxc_status == "running"

    # =========================================================
    # 7. DELETE EXISTING LXC
    # =========================================================

    - name: Delete existing LXC
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}
        method: DELETE
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code: 200
        return_content: true
      when:
        - lxc_exists
        - cleanup_existing

    # =========================================================
    # 8. WAIT FOR DELETE
    # =========================================================

    - name: Wait until old LXC is removed
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
          - 500
        return_content: true
      register: delete_check
      until: delete_check.status == 500
      retries: 60
      delay: 2
      when:
        - lxc_exists
        - cleanup_existing

    # =========================================================
    # 9. CREATE LXC
    # =========================================================

    - name: Create Ubuntu LXC
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc
        method: POST
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        body_format: form-urlencoded

        body:

          vmid: "{{ lxc_vmid }}"
          hostname: "{{ lxc_hostname }}"

          ostemplate: "{{ lxc_template }}"
          ostype: "ubuntu"

          storage: "{{ lxc_storage }}"
          rootfs: "{{ lxc_storage }}:{{ lxc_disk_size }}"

          cores: "{{ lxc_cores }}"
          memory: "{{ lxc_memory }}"
          swap: "{{ lxc_swap }}"

          password: "{{ lxc_password }}"

          unprivileged: 1
          features: "nesting=1"

          # NO VLAN TAG
          net0: "{{ lxc_net0 }}"

          start: 0
          onboot: 1

        status_code: 200
        return_content: true

      register: create_lxc
      no_log: true

    # =========================================================
    # 10. START LXC
    # =========================================================

    - name: Start LXC
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/start
        method: POST
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code: 200
        return_content: true

    # =========================================================
    # 11. WAIT UNTIL RUNNING
    # =========================================================

    - name: Wait until LXC is running
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code: 200
        return_content: true
      register: lxc_status
      until:
        - lxc_status.json.data.status | default('stopped') == "running"
      retries: 30
      delay: 2

    # =========================================================
    # 12. WAIT FOR SSH PORT
    # =========================================================

    - name: Wait for LXC SSH port
      ansible.builtin.wait_for:
        host: "{{ lxc_ip | regex_replace('/.*$', '') }}"
        port: 22
        delay: 2
        timeout: 120
        state: started

    # =========================================================
    # 13. SHOW RESULT
    # =========================================================

    - name: Show created LXC
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "LXC CREATED"
          - "=========================================="
          - "VMID:     {{ lxc_vmid }}"
          - "Hostname: {{ lxc_hostname }}"
          - "IP:       {{ lxc_ip }}"
          - "SSH:      OK"
          - "Status:   RUNNING"
          - "=========================================="


# =============================================================
# PLAY 2
# INSTALL DOCKER THROUGH SSH FROM AWX
#
# IMPORTANT:
# This play uses sshpass directly.
# Therefore an AWX Machine Credential cannot override
# the LXC password.
# =============================================================

- name: Install Docker inside LXC
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # =========================================================
    # 14. CHECK SSHPASS
    # =========================================================

    - name: Check sshpass
      ansible.builtin.command:
        cmd: which sshpass
      register: sshpass_check
      changed_when: false
      failed_when: sshpass_check.rc != 0

    # =========================================================
    # 15. CHECK SSH LOGIN
    # =========================================================

    - name: Test SSH login to LXC
      ansible.builtin.shell:
        cmd: >
          SSHPASS='{{ lxc_password }}'
          sshpass -e
          ssh
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PreferredAuthentications=password
          -o PubkeyAuthentication=no
          -o ConnectTimeout=10
          root@{{ lxc_ip | regex_replace('/.*$', '') }}
          'echo SSH_OK'
      register: ssh_test
      changed_when: false
      no_log: true

    # =========================================================
    # 16. SHOW SSH RESULT
    # =========================================================

    - name: Show SSH result
      ansible.builtin.debug:
        msg: "SSH connection to LXC is working."

    # =========================================================
    # 17. UPDATE APT
    # =========================================================

    - name: Update apt cache
      ansible.builtin.shell:
        cmd: >
          SSHPASS='{{ lxc_password }}'
          sshpass -e
          ssh
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PreferredAuthentications=password
          -o PubkeyAuthentication=no
          root@{{ lxc_ip | regex_replace('/.*$', '') }}
          'apt-get update'
      register: apt_update
      changed_when: false
      no_log: true

    # =========================================================
    # 18. INSTALL PREREQUISITES
    # =========================================================

    - name: Install Docker prerequisites
      ansible.builtin.shell:
        cmd: >
          SSHPASS='{{ lxc_password }}'
          sshpass -e
          ssh
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PreferredAuthentications=password
          -o PubkeyAuthentication=no
          root@{{ lxc_ip | regex_replace('/.*$', '') }}
          'DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gnupg lsb-release'
      register: docker_prerequisites
      changed_when: true
      no_log: true

    # =========================================================
    # 19. CREATE KEYRING DIRECTORY
    # =========================================================

    - name: Create Docker keyring directory
      ansible.builtin.shell:
        cmd: >
          SSHPASS='{{ lxc_password }}'
          sshpass -e
          ssh
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PreferredAuthentications=password
          -o PubkeyAuthentication=no
          root@{{ lxc_ip | regex_replace('/.*$', '') }}
          'install -d -m 0755 /etc/apt/keyrings'
      changed_when: true
      no_log: true

    # =========================================================
    # 20. DOWNLOAD DOCKER GPG KEY
    # =========================================================

    - name: Install Docker GPG key
      ansible.builtin.shell:
        cmd: >
          SSHPASS='{{ lxc_password }}'
          sshpass -e
          ssh
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PreferredAuthentications=password
          -o PubkeyAuthentication=no
          root@{{ lxc_ip | regex_replace('/.*$', '') }}
          'curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc && chmod 0644 /etc/apt/keyrings/docker.asc'
      changed_when: true
      no_log: true

    # =========================================================
    # 21. ADD DOCKER REPOSITORY
    # =========================================================

    - name: Add Docker repository
      ansible.builtin.shell:
        cmd: >
          SSHPASS='{{ lxc_password }}'
          sshpass -e
          ssh
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PreferredAuthentications=password
          -o PubkeyAuthentication=no
          root@{{ lxc_ip | regex_replace('/.*$', '') }}
          'bash -c "echo \"deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ lxc_codename | default('jammy') }} stable\" > /etc/apt/sources.list.d/docker.list"'
      changed_when: true
      no_log: true

    # =========================================================
    # 22. UPDATE APT AFTER DOCKER REPOSITORY
    # =========================================================

    - name: Update apt cache after Docker repository
      ansible.builtin.shell:
        cmd: >
          SSHPASS='{{ lxc_password }}'
          sshpass -e
          ssh
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PreferredAuthentications=password
          -o PubkeyAuthentication=no
          root@{{ lxc_ip | regex_replace('/.*$', '') }}
          'apt-get update'
      changed_when: false
      no_log: true

    # =========================================================
    # 23. INSTALL DOCKER
    # =========================================================

    - name: Install Docker Engine
      ansible.builtin.shell:
        cmd: >
          SSHPASS='{{ lxc_password }}'
          sshpass -e
          ssh
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PreferredAuthentications=password
          -o PubkeyAuthentication=no
          root@{{ lxc_ip | regex_replace('/.*$', '') }}
          'DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin'
      register: docker_install
      changed_when: true
      no_log: true

    # =========================================================
    # 24. ENABLE DOCKER
    # =========================================================

    - name: Enable and start Docker
      ansible.builtin.shell:
        cmd: >
          SSHPASS='{{ lxc_password }}'
          sshpass -e
          ssh
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PreferredAuthentications=password
          -o PubkeyAuthentication=no
          root@{{ lxc_ip | regex_replace('/.*$', '') }}
          'systemctl enable --now docker'
      changed_when: true
      no_log: true

    # =========================================================
    # 25. CHECK DOCKER VERSION
    # =========================================================

    - name: Check Docker version
      ansible.builtin.shell:
        cmd: >
          SSHPASS='{{ lxc_password }}'
          sshpass -e
          ssh
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PreferredAuthentications=password
          -o PubkeyAuthentication=no
          root@{{ lxc_ip | regex_replace('/.*$', '') }}
          'docker --version'
      register: docker_version
      changed_when: false
      no_log: true

    # =========================================================
    # 26. CHECK DOCKER COMPOSE
    # =========================================================

    - name: Check Docker Compose
      ansible.builtin.shell:
        cmd: >
          SSHPASS='{{ lxc_password }}'
          sshpass -e
          ssh
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PreferredAuthentications=password
          -o PubkeyAuthentication=no
          root@{{ lxc_ip | regex_replace('/.*$', '') }}
          'docker compose version'
      register: docker_compose_version
      changed_when: false
      no_log: true

    # =========================================================
    # 27. FINAL RESULT
    # =========================================================

    - name: Show final result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "DOCKER LXC READY"
          - "=========================================="
          - "VMID:     {{ lxc_vmid }}"
          - "Hostname: {{ lxc_hostname }}"
          - "IP:       {{ lxc_ip }}"
          - "Docker:   {{ docker_version.stdout }}"
          - "Compose:  {{ docker_compose_version.stdout }}"
          - "=========================================="
          - "LXC REMAINS RUNNING"
          - "=========================================="