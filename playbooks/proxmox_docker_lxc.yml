---
- name: Create Docker LXC on Proxmox
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # =========================================================
    # PROXMOX
    # =========================================================

    proxmox_api_host: "172.16.11.6"
    proxmox_node: "pve"

    # =========================================================
    # LXC
    # =========================================================

    lxc_vmid: 151
    lxc_hostname: "docker-151"
    lxc_template: "pve-sdb:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"

    lxc_password: "ChangeMe123!"

    lxc_cores: 2
    lxc_memory: 2048
    lxc_swap: 512
    lxc_disk: 10

    lxc_storage: "pve-sde"

    # =========================================================
    # NETWORK
    # =========================================================

    lxc_bridge: "vmbr1"
    lxc_ip: "172.16.12.151/24"
    lxc_ip_plain: "172.16.12.151"
    lxc_gateway: "172.16.12.254"

  tasks:

    # =========================================================
    # 1. CHECK VMID
    # =========================================================

    - name: Check existing LXC
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current"
        method: GET
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        status_code:
          - 200
          - 404
          - 500
        return_content: true
      register: existing_lxc

    - name: Stop if LXC already exists
      ansible.builtin.fail:
        msg: "LXC {{ lxc_vmid }} already exists on {{ proxmox_node }}"
      when: existing_lxc.status == 200

    # =========================================================
    # 2. CREATE LXC
    # =========================================================

    - name: Create LXC container
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc"
        method: POST
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        body_format: form-urlencoded
        body:
          vmid: "{{ lxc_vmid }}"
          hostname: "{{ lxc_hostname }}"
          ostemplate: "{{ lxc_template }}"
          password: "{{ lxc_password }}"

          cores: "{{ lxc_cores }}"
          memory: "{{ lxc_memory }}"
          swap: "{{ lxc_swap }}"

          rootfs: "{{ lxc_storage }}:{{ lxc_disk }}"

          net0: "name=eth0,bridge={{ lxc_bridge }},ip={{ lxc_ip }},gw={{ lxc_gateway }}"

          features: "nesting=1"
          unprivileged: 1
          onboot: 1
          start: 0

        status_code:
          - 200
        return_content: true
      register: lxc_create

    - name: Show LXC creation UPID
      ansible.builtin.debug:
        var: lxc_create.json

    # =========================================================
    # 3. WAIT CREATE
    # =========================================================

    - name: Wait for LXC creation task
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/tasks/{{ lxc_create.json.data }}/status"
        method: GET
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        return_content: true
      register: create_task
      until: create_task.json.data.status == "stopped"
      retries: 60
      delay: 2

    - name: Check LXC creation result
      ansible.builtin.fail:
        msg: "LXC creation failed: {{ create_task.json.data | default(create_task.json) }}"
      when:
        - create_task.json.data.exitstatus is defined
        - create_task.json.data.exitstatus != "OK"

    # =========================================================
    # 4. START LXC
    # =========================================================

    - name: Start LXC
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/start"
        method: POST
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        status_code:
          - 200
        return_content: true
      register: lxc_start

    - name: Show LXC start UPID
      ansible.builtin.debug:
        var: lxc_start.json

    # =========================================================
    # 5. WAIT START
    # =========================================================

    - name: Wait for LXC start task
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/tasks/{{ lxc_start.json.data }}/status"
        method: GET
        validate_certs: false
        headers:
          Authorization: "PVEAPIToken=awx@pve!awx={{ proxmox_token }}"
        return_content: true
      register: start_task
      until: start_task.json.data.status == "stopped"
      retries: 60
      delay: 2

    - name: Check LXC start result
      ansible.builtin.fail:
        msg: "LXC start failed: {{ start_task.json.data | default(start_task.json) }}"
      when:
        - start_task.json.data.exitstatus is defined
        - start_task.json.data.exitstatus != "OK"

    # =========================================================
    # 6. WAIT FOR SSH
    # =========================================================

    - name: Wait for SSH port
      ansible.builtin.wait_for:
        host: "{{ lxc_ip_plain }}"
        port: 22
        state: started
        timeout: 120
        delay: 5
      delegate_to: localhost

    # =========================================================
    # 7. ADD LXC TO ANSIBLE INVENTORY
    # =========================================================

    - name: Add LXC to temporary inventory
      ansible.builtin.add_host:
        name: "lxc-{{ lxc_vmid }}"
        groups:
          - docker_lxc
        ansible_host: "{{ lxc_ip_plain }}"
        ansible_user: root
        ansible_password: "{{ lxc_password }}"
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    # =========================================================
    # 8. DEPLOYMENT INFORMATION
    # =========================================================

    - name: Show LXC information
      ansible.builtin.debug:
        msg:
          - "LXC created successfully"
          - "VMID: {{ lxc_vmid }}"
          - "Hostname: {{ lxc_hostname }}"
          - "IP: {{ lxc_ip_plain }}"
          - "SSH: {{ lxc_ip_plain }}:22"


# =============================================================
# SECOND PLAY
# =============================================================

- name: Configure Docker inside LXC
  hosts: docker_lxc
  gather_facts: true

  become: false

  tasks:

    # =========================================================
    # 9. TEST SSH
    # =========================================================

    - name: Test SSH connection
      ansible.builtin.ping:

    # =========================================================
    # 10. APT UPDATE
    # =========================================================

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # =========================================================
    # 11. INSTALL PREREQUISITES
    # =========================================================

    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    # =========================================================
    # 12. DOCKER KEYRING
    # =========================================================

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    # =========================================================
    # 13. DOCKER REPOSITORY
    # =========================================================

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    # =========================================================
    # 14. INSTALL DOCKER
    # =========================================================

    - name: Install Docker Engine
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    # =========================================================
    # 15. ENABLE DOCKER
    # =========================================================

    - name: Enable Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # =========================================================
    # 16. CHECK DOCKER
    # =========================================================

    - name: Check Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Show Docker version
      ansible.builtin.debug:
        var: docker_version.stdout

    # =========================================================
    # 17. CHECK COMPOSE
    # =========================================================

    - name: Check Docker Compose version
      ansible.builtin.command:
        cmd: docker compose version
      register: docker_compose
      changed_when: false

    - name: Show Docker Compose version
      ansible.builtin.debug:
        var: docker_compose.stdout

    # =========================================================
    # 18. FINAL RESULT
    # =========================================================

    - name: Deployment summary
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "LXC DEPLOYMENT SUCCESSFUL"
          - "========================================"
          - "VMID: {{ lxc_vmid }}"
          - "Hostname: {{ lxc_hostname }}"
          - "IP: {{ lxc_ip_plain }}"
          - "SSH: {{ lxc_ip_plain }}:22"
          - "CPU: {{ lxc_cores }}"
          - "RAM: {{ lxc_memory }} MB"
          - "Disk: {{ lxc_disk }} GB"
          - "Disk storage: {{ lxc_storage }}"
          - "Template storage: pve-sdb"
          - "Bridge: {{ lxc_bridge }}"
          - "Docker: INSTALLED"
          - "Docker Compose: INSTALLED"
          - "========================================"