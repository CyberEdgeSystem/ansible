# =============================================================
# PROXMOX LXC TEMPLATE + DOCKER
#
# AWX -> Ansible -> Proxmox API
#     -> clone CT199
#     -> configure CT
#     -> start CT
#     -> SSH
#     -> Docker
#
# CT199 = prepared Proxmox LXC template
#
# AWX Extra Variables:
#
# proxmox_token: "YOUR_PROXMOX_API_TOKEN"
# lxc_vmid: 151
# lxc_hostname: "docker-151"
# lxc_password: "12345678"
# lxc_ip: "172.16.12.151/24"
# lxc_gateway: "172.16.12.254"
#
# =============================================================


# =============================================================
# PLAY 1
# CLONE + CONFIGURE + START LXC
# =============================================================

- name: Deploy LXC from Proxmox template
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ---------------------------------------------------------
    # PROXMOX API
    # ---------------------------------------------------------

    proxmox_host: "172.16.11.6"
    proxmox_node: "pve"
    proxmox_api_port: 8006

    proxmox_user: "awx@pve"
    proxmox_token_name: "awx"

    proxmox_api_url: >-
      https://{{ proxmox_host }}:{{ proxmox_api_port }}/api2/json

    proxmox_auth_header:
      Authorization: >-
        PVEAPIToken={{ proxmox_user }}!{{ proxmox_token_name }}={{ proxmox_token }}

    # ---------------------------------------------------------
    # PROXMOX TEMPLATE
    # ---------------------------------------------------------

    # CT199 is our prepared template
    lxc_template_vmid: 199

    # Storage for cloned LXC
    lxc_storage: "pve-sde"

    # ---------------------------------------------------------
    # LXC RESOURCES
    # ---------------------------------------------------------

    lxc_cores: 2
    lxc_memory: 2048
    lxc_swap: 512

    # ---------------------------------------------------------
    # NETWORK
    # ---------------------------------------------------------

    lxc_bridge: "vmbr1"

    # IMPORTANT:
    # NO VLAN TAG
    #
    # VLAN 1032 is NOT added here because vmbr1
    # already provides the required network.

    lxc_net0: >-
      name=eth0,bridge={{ lxc_bridge }},ip={{ lxc_ip }},gw={{ lxc_gateway }}

    # ---------------------------------------------------------
    # BEHAVIOUR
    # ---------------------------------------------------------

    cleanup_existing: true


  tasks:

    # =========================================================
    # 1. VALIDATE VARIABLES
    # =========================================================

    - name: Validate required AWX variables
      ansible.builtin.assert:
        that:

          - proxmox_token is defined
          - proxmox_token | length > 0

          - lxc_vmid is defined
          - (lxc_vmid | string) | length > 0

          - lxc_hostname is defined
          - lxc_hostname | length > 0

          - lxc_password is defined
          - lxc_password | length > 0

          - lxc_ip is defined
          - lxc_ip | length > 0

          - lxc_gateway is defined
          - lxc_gateway | length > 0

        fail_msg: |
          Required AWX Extra Variables are missing.

          Required variables:

          proxmox_token
          lxc_vmid
          lxc_hostname
          lxc_password
          lxc_ip
          lxc_gateway


    # =========================================================
    # 2. SHOW PARAMETERS
    # =========================================================

    - name: Show deployment parameters
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "PROXMOX LXC DEPLOYMENT"
          - "=========================================="
          - "Template VMID: {{ lxc_template_vmid }}"
          - "Target VMID:   {{ lxc_vmid }}"
          - "Hostname:      {{ lxc_hostname }}"
          - "IP:            {{ lxc_ip }}"
          - "Gateway:       {{ lxc_gateway }}"
          - "Bridge:        {{ lxc_bridge }}"
          - "Storage:       {{ lxc_storage }}"
          - "CPU:           {{ lxc_cores }}"
          - "RAM:           {{ lxc_memory }} MB"
          - "Swap:          {{ lxc_swap }} MB"
          - "=========================================="


    # =========================================================
    # 3. CHECK EXISTING LXC
    # =========================================================

    - name: Check whether target LXC exists
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
          - 500
        return_content: true

      register: existing_lxc

      failed_when: false


    - name: Determine whether target LXC exists
      ansible.builtin.set_fact:
        lxc_exists: "{{ existing_lxc.status == 200 }}"


    # =========================================================
    # 4. GET EXISTING STATUS
    # =========================================================

    - name: Get existing LXC status
      ansible.builtin.set_fact:
        existing_lxc_status: >-
          {{ existing_lxc.json.data.status | default('unknown') }}

      when: lxc_exists


    - name: Show existing LXC status
      ansible.builtin.debug:
        msg:
          - "Existing LXC: {{ lxc_exists }}"
          - "Status: {{ existing_lxc_status | default('N/A') }}"


    # =========================================================
    # 5. STOP EXISTING LXC
    # =========================================================

    - name: Stop existing LXC
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/stop
        method: POST
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code: 200
        return_content: true

      when:
        - lxc_exists
        - cleanup_existing
        - existing_lxc_status == "running"


    # =========================================================
    # 6. WAIT FOR STOP
    # =========================================================

    - name: Wait until existing LXC is stopped
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
          - 500
        return_content: true

      register: stop_check

      until:
        - stop_check.status == 500
          or
          stop_check.json.data.status | default('stopped') == "stopped"

      retries: 30
      delay: 2

      when:
        - lxc_exists
        - cleanup_existing
        - existing_lxc_status == "running"


    # =========================================================
    # 7. DELETE EXISTING LXC
    # =========================================================

    - name: Delete existing LXC
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}
        method: DELETE
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code: 200
        return_content: true

      when:
        - lxc_exists
        - cleanup_existing


    # =========================================================
    # 8. WAIT FOR DELETE
    # =========================================================

    - name: Wait until target LXC is removed
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current
        method: GET
        headers: "{{ proxmox_auth_header }}"
        validate_certs: false
        status_code:
          - 200
          - 500
        return_content: true

      register: delete_check

      until:
        - delete_check.status == 500

      retries: 60
      delay: 2

      when:
        - lxc_exists
        - cleanup_existing


    # =========================================================
    # 9. CLONE CT199 -> TARGET VMID
    # =========================================================

    - name: Clone LXC template
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_template_vmid }}/clone

        method: POST

        headers: "{{ proxmox_auth_header }}"

        validate_certs: false

        body_format: form-urlencoded

        body:

          # New VMID
          newid: "{{ lxc_vmid }}"

          # Destination node
          target: "{{ proxmox_node }}"

          # Full clone
          full: 1

          # Storage for cloned disk
          storage: "{{ lxc_storage }}"

          # Temporary hostname
          hostname: "{{ lxc_hostname }}"

        status_code: 200

        return_content: true

      register: clone_lxc

      no_log: true


    # =========================================================
    # 10. WAIT FOR CLONE TASK
    # =========================================================

    - name: Wait for Proxmox clone task
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/tasks/{{
          clone_lxc.json.data | urlencode
          }}/status

        method: GET

        headers: "{{ proxmox_auth_header }}"

        validate_certs: false

        status_code: 200

        return_content: true

      register: clone_status

      until:
        - clone_status.json.data.status | default('') == "stopped"
        - clone_status.json.data.exitstatus | default('ERROR') == "OK"

      retries: 120
      delay: 2


    # =========================================================
    # 11. CONFIGURE CLONED LXC
    # =========================================================

    - name: Configure cloned LXC
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/config

        method: PUT

        headers: "{{ proxmox_auth_header }}"

        validate_certs: false

        body_format: form-urlencoded

        body:

          # Identity
          hostname: "{{ lxc_hostname }}"

          # Resources
          cores: "{{ lxc_cores }}"
          memory: "{{ lxc_memory }}"
          swap: "{{ lxc_swap }}"

          # Root password
          password: "{{ lxc_password }}"

          # Features
          features: "nesting=1"

          # Network
          net0: "{{ lxc_net0 }}"

          # Startup
          onboot: 1

        status_code: 200

        return_content: true

      register: configure_lxc

      no_log: true


    # =========================================================
    # 12. START LXC
    # =========================================================

    - name: Start LXC
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/start

        method: POST

        headers: "{{ proxmox_auth_header }}"

        validate_certs: false

        status_code: 200

        return_content: true

      register: start_lxc


    # =========================================================
    # 13. WAIT UNTIL RUNNING
    # =========================================================

    - name: Wait until LXC is running
      ansible.builtin.uri:
        url: >-
          {{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/status/current

        method: GET

        headers: "{{ proxmox_auth_header }}"

        validate_certs: false

        status_code: 200

        return_content: true

      register: lxc_status

      until:
        - lxc_status.json.data.status | default('stopped') == "running"

      retries: 30
      delay: 2


    # =========================================================
    # 14. ADD LXC TO TEMPORARY INVENTORY
    # =========================================================

    - name: Add LXC to temporary inventory
      ansible.builtin.add_host:

        name: "lxc-{{ lxc_vmid }}"

        groups:
          - docker_lxc

        ansible_host: "{{ lxc_ip | regex_replace('/.*$', '') }}"

        ansible_user: "root"

        ansible_password: "{{ lxc_password }}"

        ansible_connection: "ssh"

        ansible_python_interpreter: "/usr/bin/python3"

        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PreferredAuthentications=password
          -o PubkeyAuthentication=no


    # =========================================================
    # 15. WAIT FOR SSH
    # =========================================================

    - name: Wait for LXC SSH
      ansible.builtin.wait_for:
        host: "{{ lxc_ip | regex_replace('/.*$', '') }}"
        port: 22
        delay: 2
        timeout: 120
        state: started


    # =========================================================
    # 16. SHOW CREATED LXC
    # =========================================================

    - name: Show created LXC
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "LXC CREATED FROM TEMPLATE"
          - "=========================================="
          - "Template: {{ lxc_template_vmid }}"
          - "VMID:     {{ lxc_vmid }}"
          - "Hostname: {{ lxc_hostname }}"
          - "IP:       {{ lxc_ip }}"
          - "Status:   RUNNING"
          - "=========================================="


# =============================================================
# PLAY 2
# INSTALL DOCKER
# =============================================================

- name: Install Docker inside LXC
  hosts: docker_lxc

  gather_facts: true

  become: true

  vars:

    # Explicit credentials.
    # This prevents AWX Machine Credential from overriding
    # the password required for the dynamically-created LXC.

    ansible_user: "root"

    ansible_password: "{{ hostvars['localhost']['lxc_password'] }}"

    ansible_connection: "ssh"

    ansible_python_interpreter: "/usr/bin/python3"

    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o PreferredAuthentications=password
      -o PubkeyAuthentication=no


  tasks:

    # =========================================================
    # 17. VERIFY SSH
    # =========================================================

    - name: Verify SSH connection
      ansible.builtin.command:
        cmd: whoami

      register: current_user

      changed_when: false


    - name: Show connected user
      ansible.builtin.debug:
        var: current_user.stdout


    # =========================================================
    # 18. UPDATE APT
    # =========================================================

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600


    # =========================================================
    # 19. DOCKER PREREQUISITES
    # =========================================================

    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release

        state: present


    # =========================================================
    # 20. DOCKER KEYRING
    # =========================================================

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"


    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"


    # =========================================================
    # 21. DOCKER REPOSITORY
    # =========================================================

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }}
          stable

        filename: docker

        state: present


    - name: Update apt cache after Docker repository
      ansible.builtin.apt:
        update_cache: true


    # =========================================================
    # 22. INSTALL DOCKER
    # =========================================================

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin

        state: present


    # =========================================================
    # 23. START DOCKER
    # =========================================================

    - name: Enable Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started


    # =========================================================
    # 24. VERIFY DOCKER
    # =========================================================

    - name: Check Docker version
      ansible.builtin.command:
        cmd: docker --version

      register: docker_version

      changed_when: false


    - name: Check Docker Compose
      ansible.builtin.command:
        cmd: docker compose version

      register: docker_compose_version

      changed_when: false


    # =========================================================
    # 25. FINAL RESULT
    # =========================================================

    - name: Final result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "DOCKER LXC READY"
          - "=========================================="
          - "Template: {{ hostvars['localhost']['lxc_template_vmid'] }}"
          - "VMID:     {{ hostvars['localhost']['lxc_vmid'] }}"
          - "Hostname: {{ hostvars['localhost']['lxc_hostname'] }}"
          - "IP:       {{ ansible_host }}"
          - "Docker:   {{ docker_version.stdout }}"
          - "Compose:  {{ docker_compose_version.stdout }}"
          - "=========================================="
          - "LXC REMAINS RUNNING"
          - "=========================================="